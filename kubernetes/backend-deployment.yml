apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitverse-backend
  labels:
    app: fitverse-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitverse-backend
  template:
    metadata:
      labels:
        app: fitverse-backend
    spec:
      containers:
      - name: backend
        image: xjohnfit/fitverse-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4001"
        - name: FRONTEND_URL
          value: "https://fitverse.codewithxjohn.com"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: fitverse-secrets
              key: MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: fitverse-secrets
              key: JWT_SECRET
        - name: CLOUDINARY_CLOUD_NAME
          valueFrom:
            secretKeyRef:
              name: fitverse-secrets
              key: CLOUDINARY_CLOUD_NAME
        - name: CLOUDINARY_API_KEY
          valueFrom:
            secretKeyRef:
              name: fitverse-secrets
              key: CLOUDINARY_API_KEY
        - name: CLOUDINARY_API_SECRET
          valueFrom:
            secretKeyRef:
              name: fitverse-secrets
              key: CLOUDINARY_API_SECRET
        - name: FATSECRET_CONSUMER_KEY
          valueFrom:
            secretKeyRef:
              name: fitverse-secrets
              key: FATSECRET_CONSUMER_KEY
        - name: FATSECRET_CONSUMER_SECRET
          valueFrom:
            secretKeyRef:
              name: fitverse-secrets
              key: FATSECRET_CONSUMER_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 4001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 4001
          initialDelaySeconds: 5
          periodSeconds: 5
