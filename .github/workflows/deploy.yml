name: Build and Deploy

on:
  push:
    branches: 
      - main

env:
  BACKEND_IMAGE: xjohnfit/mern-fit-verse-backend
  FRONTEND_IMAGE: xjohnfit/mern-fit-verse-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: [self-hosted]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_K3S" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        env:
          KUBECONFIG_K3S: ${{ secrets.KUBECONFIG_K3S }}

      - name: Create Docker registry secret
        run: |
          kubectl delete secret regcred --ignore-not-found
          kubectl create secret docker-registry regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create application secrets
        run: |
          kubectl delete secret mern-fit-verse-secrets --ignore-not-found
          kubectl create secret generic mern-fit-verse-secrets \
            --from-literal=mongodb-uri="${{ secrets.MONGODB_URI }}" \
            --from-literal=jwt-secret="${{ secrets.JWT_SECRET }}"

      - name: Apply Kubernetes manifests
        run: kubectl apply -f kubernetes/

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment/mern-fit-verse-backend
          kubectl rollout restart deployment/mern-fit-verse-frontend

      - name: Wait for backend deployment
        run: kubectl rollout status deployment/mern-fit-verse-backend --timeout=5m

      - name: Wait for frontend deployment
        run: kubectl rollout status deployment/mern-fit-verse-frontend --timeout=5m

      - name: Get deployment status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -l app=mern-fit-verse-backend
          kubectl get pods -l app=mern-fit-verse-frontend
          echo "=== Services ==="
          kubectl get svc -l app=mern-fit-verse-backend
          kubectl get svc -l app=mern-fit-verse-frontend
          echo "=== Ingress ==="
          kubectl get ingress mern-fit-verse
